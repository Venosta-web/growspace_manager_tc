---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: prerelease
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: pip
    directory: /
    target-branch: prerelease
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      dev-tooling:
        patterns:
          - ruff
          - mypy
          - pre-commit
          - yamllint
          - codespell
      home-assistant-test-stack:
        patterns:
          - homeassistant
          - pytest-homeassistant-custom-component
    ignore:
      # The plugin pins these exactly; update them through the HA test stack.
      - dependency-name: pytest
      - dependency-name: pytest-asyncio
      - dependency-name: pytest-cov
      - dependency-name: pytest-xdist
      - dependency-name: coverage
      - dependency-name: freezegun
      - dependency-name: requests-mock
      - dependency-name: syrupy
      # Home Assistant constrains its transitive dependencies in
      # homeassistant/package_constraints.txt; they are not direct TC pins.
