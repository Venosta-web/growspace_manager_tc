---
name: Pre-release

"on":
  push:
    branches:
      - prerelease

concurrency:
  group: prerelease-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      # The computed version is written into the workspace copy of the manifest
      # and never committed: `prerelease` keeps naming the stable version it is
      # a beta of, which is what the next run's calculation reads.
      - name: Update version
        id: version_step
        run: |
          STABLE_VERSION="$(
            jq -r .version \
              custom_components/growspace_manager_tc/manifest.json
          )"
          VERSION="$(
            python3 .github/scripts/prerelease_version.py \
              "$STABLE_VERSION" \
              "$GITHUB_RUN_NUMBER"
          )"
          echo "New version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          manifest="custom_components/growspace_manager_tc/manifest.json"
          if ! jq --arg v "$VERSION" '.version = $v' "$manifest" \
            > "$manifest.tmp"; then
            echo "jq command failed"
            exit 1
          fi
          mv "$manifest.tmp" "$manifest"

      # 2. Creates the ZIP file HACS downloads instead of the branch
      - name: ZIP Release
        run: python3 .github/scripts/build_release_archive.py

      # 3. Creates the GitHub Pre-release and attaches the new zip file
      - name: Create Pre-release
        uses: softprops/action-gh-release@v3.0.2
        with:
          prerelease: true
          tag_name: v${{ steps.version_step.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Pre-release-${{ github.ref_name }}-${{ github.sha }}
          generate_release_notes: true
          files: growspace_manager_tc.zip
          fail_on_unmatched_files: true

      - name: Verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.version_step.outputs.version }}
        run: |
          tag_sha="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" \
              --jq .object.sha
          )"
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo \
              "Tag $TAG_NAME points to $tag_sha; expected $GITHUB_SHA" \
              >&2
            exit 1
          fi

      # 4. Delete Older Pre-releases
      - name: Delete Older Pre-releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          # Number of most recent pre-releases to keep.
          keep_latest: 5
          delete_prerelease_only: true
          # Also delete the tags associated with the releases.
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
