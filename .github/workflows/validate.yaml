---
name: HACS/HASS

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: >-
    validation-${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6.0.2
      - name: validation
        uses: home-assistant/actions/hassfest@master

  validate-hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6.0.2
      - name: validation
        uses: hacs/action@main
        with:
          category: integration
          # Brand images ship in custom_components/growspace_manager_tc/brand,
          # which Home Assistant's own `brands` component has served for custom
          # integrations since core 2026.3 — it reads that directory before it
          # asks the CDN. The HACS check only ever asks the home-assistant/brands
          # repository, where a local set does not appear and is not meant to,
          # so this is ignored on purpose rather than pending a submission.
          ignore: brands
