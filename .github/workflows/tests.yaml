---
name: Tests

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: >-
    validation-${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v7.0.0
        name: Setup Node.js
        with:
          node-version: "24"
      - name: Test branch maintenance safeguards
        run: node --test .github/scripts/branch-cleanup.test.cjs
      - name: Detect the Python integration scaffold
        id: scaffold
        shell: bash
        run: |
          expected=(
            requirements.txt
            tests
            custom_components/growspace_manager_tc
          )
          present=0
          for path in "${expected[@]}"; do
            if [[ -e "$path" ]]; then
              present=$((present + 1))
            fi
          done
          if [[ "$present" -eq 0 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [[ "$present" -ne "${#expected[@]}" ]]; then
            echo "The Python scaffold is incomplete; expected: ${expected[*]}" >&2
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6.2.0
        if: steps.scaffold.outputs.ready == 'true'
        name: Setup Python
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        if: steps.scaffold.outputs.ready == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "$(grep '^homeassistant==' requirements.txt)"
          constraints_file="$(
            python -c 'import homeassistant, pathlib; print(
              pathlib.Path(homeassistant.__file__).parent
              / "package_constraints.txt"
            )'
          )"
          pip install -r requirements.txt -c "$constraints_file"
      - name: Record resolved dependency set
        if: steps.scaffold.outputs.ready == 'true'
        run: pip freeze
      - name: Run unit tests
        if: steps.scaffold.outputs.ready == 'true'
        run: >-
          pytest
          --cov=custom_components/growspace_manager_tc
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
      - name: Upload coverage reports to Codecov
        if: steps.scaffold.outputs.ready == 'true'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true
      - name: Explain deferred Python checks
        if: steps.scaffold.outputs.ready != 'true'
        run: >-
          echo "The repository is documentation-only; pytest and Codecov start
          automatically when the complete Python scaffold is added."
