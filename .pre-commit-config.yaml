---
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Checked against requirements.txt by lint.yaml's check_lint_tool_pins step.
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
        files: ^(\.github/scripts|custom_components|tests)/.+\.(py|pyi)$
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=hass
          - --quiet-level=2
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: no-commit-to-branch
        args:
          - --branch=main
  - repo: https://github.com/adrienverge/yamllint.git
    # Checked against requirements.txt by lint.yaml's check_lint_tool_pins step.
    rev: v1.37.1
    hooks:
      - id: yamllint
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.6.2
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.6.2
          - prettier-plugin-sort-json@4.2.0
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python3 .github/scripts/run_venv_tool.py pytest
        language: system
        pass_filenames: false
        types: [python]
        files: ^(custom_components|tests)/.+\.py$
      - id: mypy
        name: mypy
        entry: python3 .github/scripts/run_venv_tool.py mypy
        args: [--follow-imports=silent]
        language: system
        require_serial: true
        types_or: [python, pyi]
        files: ^(\.github/scripts|custom_components)/.+\.(py|pyi)$
